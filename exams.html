<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JEE MAINS/NEET PRACTICE PORTAL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BODY */
body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    min-height:100vh;
}

/* HEADER */
header{
    width:100%;
    padding:18px 40px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

/* LOGO */
.logo{
    font-size:26px;
    font-weight:700;
    color:white;
    letter-spacing:2px;
}

/* NAV RIGHT SIDE */
nav ul{
    display:flex;
    gap:15px;
    list-style:none;
    align-items:center;
}

/* BUTTON STYLE */
nav ul li a{
    text-decoration:none;
    color:white;
    padding:10px 16px;
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    transition:0.3s;
    font-weight:600;
    position:relative;
    overflow:hidden;
}

/* HOVER EFFECT */
nav ul li a:hover{
    background:#38bdf8;
    transform:translateY(-3px);
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* CLICK EFFECT */
nav ul li a:active{
    transform:scale(0.95);
}

/* DASHBOARD CONTENT */
.container{
    padding-top:120px;
    text-align:center;
    color:white;
}

h1{
    font-size:40px;
    margin-bottom:10px;
    animation:fadeIn 1s ease;
}

p{
    font-size:18px;
    opacity:0.8;
}

/* ANIMATION */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */
@media(max-width:768px){

    header{
        flex-direction:column;
        gap:10px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }
}
body{
    font-family:Poppins;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    color:white;
    display:flex;
    justify-content:center;
    padding:40px;
}

.card{
    width:700px;
    background:rgba(255,255,255,0.1);
    padding:25px;
    border-radius:20px;
    backdrop-filter:blur(15px);
	animation:fadeIn 0.8s ease;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

/* SUBJECT BLOCK */
.subject{
    margin-bottom:20px;
    padding:15px;
    background:rgba(255,255,255,0.08);
    border-radius:15px;
}

.subject h3{
    margin-bottom:10px;
    color:#facc15;
}

/* GRID UNITS */
.units{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

label{
    font-size:14px;
}

/* BUTTON */
button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:white;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#0ea5e9;
}

</style>
</head>

<body>
<!-- HEADER -->
<header>

    <div class="logo">
        STUDENT DASHBOARD
    </div>

    <nav>
        <ul>

            <li><a href="exams.html">Exams</a></li>
            <li><a href="results.html">Results</a></li>
            <li><a href="key.html">Key</a></li>
            <li><a href="account.html">Account</a></li>

        </ul>
    </nav>

</header>
<div class="card">

    <h2>Select Syllabus Units</h2>

    <!-- MATHS -->
    <div class="subject">
        <h3>Maths A</h3>
        <div class="units">
            <label><input type="checkbox"> Unit 1</label>
            <label><input type="checkbox"> Unit 2</label>
            <label><input type="checkbox"> Unit 3</label>
            <label><input type="checkbox"> Unit 4</label>
            <label><input type="checkbox"> Unit 5</label>
            <label><input type="checkbox"> Unit 6</label>
            <label><input type="checkbox"> Unit 7</label>
            <label><input type="checkbox"> Unit 8</label>
            <label><input type="checkbox"> Unit 9</label>
            <label><input type="checkbox"> Unit 10</label>
        </div>
    </div>
	<div class="subject">
        <h3>Maths B</h3>
        <div class="units">
            <label><input type="checkbox"> Unit 1</label>
            <label><input type="checkbox"> Unit 2</label>
            <label><input type="checkbox"> Unit 3</label>
            <label><input type="checkbox"> Unit 4</label>
            <label><input type="checkbox"> Unit 5</label>
            <label><input type="checkbox"> Unit 6</label>
            <label><input type="checkbox"> Unit 7</label>
            <label><input type="checkbox"> Unit 8</label>
            <label><input type="checkbox"> Unit 9</label>
            <label><input type="checkbox"> Unit 10</label>
        </div>
    </div>

    <!-- PHYSICS -->
    <div class="subject">
        <h3>Physics</h3>
        <div class="units">
            <label><input type="checkbox"> Unit 1</label>
            <label><input type="checkbox"> Unit 2</label>
            <label><input type="checkbox"> Unit 3</label>
            <label><input type="checkbox"> Unit 4</label>
            <label><input type="checkbox"> Unit 5</label>
            <label><input type="checkbox"> Unit 6</label>
            <label><input type="checkbox"> Unit 7</label>
            <label><input type="checkbox"> Unit 8</label>
            <label><input type="checkbox"> Unit 9</label>
            <label><input type="checkbox"> Unit 10</label>
        </div>
    </div>

    <!-- CHEMISTRY -->
    <div class="subject">
        <h3>Chemistry</h3>
        <div class="units">
            <label><input type="checkbox"> Unit 1</label>
            <label><input type="checkbox"> Unit 2</label>
            <label><input type="checkbox"> Unit 3</label>
            <label><input type="checkbox"> Unit 4</label>
            <label><input type="checkbox"> Unit 5</label>
            <label><input type="checkbox"> Unit 6</label>
            <label><input type="checkbox"> Unit 7</label>
            <label><input type="checkbox"> Unit 8</label>
            <label><input type="checkbox"> Unit 9</label>
            <label><input type="checkbox"> Unit 10</label>
        </div>
    </div>

    <button onclick="goNext()">Submit & Continue</button>

</div>

<script>

function goNext(){

    let boxes = document.querySelectorAll("input[type='checkbox']");
    let selected = false;

    boxes.forEach(b=>{
        if(b.checked){
            selected = true;
        }
    });

    if(!selected){
        alert("Please select at least one unit");
        return;
    }

    alert("Syllabus Selected Successfully 🎉");

    window.location.href = "nta/login.html";
}

</script>

</body>
</html>
