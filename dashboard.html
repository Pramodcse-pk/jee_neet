<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JEE MAINS/NEET PRACTICE PORTAL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/* BODY */
body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    min-height:100vh;
}

/* HEADER */
header{
    width:100%;
    padding:18px 40px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

/* LOGO */
.logo{
    font-size:26px;
    font-weight:700;
    color:white;
    letter-spacing:2px;
}

/* NAV RIGHT SIDE */
nav ul{
    display:flex;
    gap:15px;
    list-style:none;
    align-items:center;
}

/* BUTTON STYLE */
nav ul li a{
    text-decoration:none;
    color:white;
    padding:10px 16px;
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    transition:0.3s;
    font-weight:600;
    position:relative;
    overflow:hidden;
}

/* HOVER EFFECT */
nav ul li a:hover{
    background:#38bdf8;
    transform:translateY(-3px);
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* CLICK EFFECT */
nav ul li a:active{
    transform:scale(0.95);
}

/* DASHBOARD CONTENT */
.container{
    padding-top:120px;
    text-align:center;
    color:white;
}

h1{
    font-size:40px;
    margin-bottom:10px;
    animation:fadeIn 1s ease;
}

p{
    font-size:18px;
    opacity:0.8;
}

/* ANIMATION */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */
@media(max-width:768px){

    header{
        flex-direction:column;
        gap:10px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        STUDENT DASHBOARD
    </div>

    <nav>
        <ul>

            <li><a href="exams.html">Exams</a></li>
            <li><a href="results.html">Results</a></li>
            <li><a href="key.html">Key</a></li>
            <li><a href="account.html">Account</a></li>

        </ul>
    </nav>

</header>

<!-- CONTENT -->
<div class="container">

    <h1>Welcome to Student Dashboard</h1>
    <p>Select options from top navigation</p>

</div>

</body>
</html>
