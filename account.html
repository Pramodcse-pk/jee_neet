<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    color:white;
}

/* HEADER */
header{
    width:100%;
    padding:18px 40px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    left:0;
}

.logo{
    font-size:24px;
    font-weight:700;
}

/* CONTENT AREA */
.container{
    padding-top:120px;
    display:flex;
    justify-content:center;
}

/* LIST CARD */
.card{
    width:500px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.8s ease;
}

/* TITLE */
h2{
    text-align:center;
    margin-bottom:20px;
}

/* LIST ITEMS */
.item{
    padding:15px;
    margin:12px 0;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:0.3s;
    font-weight:500;
}

.item:hover{
    background:#38bdf8;
    transform:translateX(5px);
}

/* COLORS */
.logout{
    background:rgba(239,68,68,0.2);
}

.logout:hover{
    background:#ef4444;
}

/* INPUT BOX */
.input-box{
    display:none;
    margin-top:10px;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    outline:none;
}

/* BUTTON */
button{
    margin-top:10px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#22c55e;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#16a34a;
}

/* MESSAGE */
#msg{
    text-align:center;
    margin-top:10px;
}

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
/* HEADER */
header{
    width:100%;
    padding:18px 40px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

/* LOGO */
.logo{
    font-size:26px;
    font-weight:700;
    color:white;
    letter-spacing:2px;
}

/* NAV RIGHT SIDE */
nav ul{
    display:flex;
    gap:15px;
    list-style:none;
    align-items:center;
}

/* BUTTON STYLE */
nav ul li a{
    text-decoration:none;
    color:white;
    padding:10px 16px;
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    transition:0.3s;
    font-weight:600;
    position:relative;
    overflow:hidden;
}

/* HOVER EFFECT */
nav ul li a:hover{
    background:#38bdf8;
    transform:translateY(-3px);
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* CLICK EFFECT */
nav ul li a:active{
    transform:scale(0.95);
}

/* DASHBOARD CONTENT */
.container{
    padding-top:120px;
    text-align:center;
    color:white;
}

h1{
    font-size:40px;
    margin-bottom:10px;
    animation:fadeIn 1s ease;
}

p{
    font-size:18px;
    opacity:0.8;
}

/* ANIMATION */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */
@media(max-width:768px){

    header{
        flex-direction:column;
        gap:10px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">STUDENT DASHBOARD</div>
	 <nav>
        <ul>

            <li><a href="exams.html">Exams</a></li>
            <li><a href="results.html">Results</a></li>
            <li><a href="key.html">Key</a></li>
            <li><a href="account.html">Account</a></li>

        </ul>
    </nav>
</header>

<!-- CONTENT -->
<div class="container">

<div class="card">

    <h2>Account Settings</h2>

    <!-- PROFILE -->
    <div class="item" onclick="showProfile()">
        👤 Profile Info
        <span>›</span>
    </div>

    <!-- CHANGE PASSWORD -->
    <div class="item" onclick="togglePassword()">
        🔑 Change Password
        <span>›</span>
    </div>

    <div class="input-box" id="passBox">

        <input type="password" id="newPass" placeholder="Enter New Password">

        <button onclick="savePassword()">Save Password</button>

    </div>

    <!-- LOGOUT -->
    <div class="item logout" onclick="logoutUser()">
        🚪 Logout
        <span>›</span>
    </div>

    <div id="msg"></div>

</div>

</div>

<script>

/* SHOW PROFILE */
function showProfile(){
    alert("Name: Student\nCourse: JEE/NEET");
}

/* TOGGLE PASSWORD BOX */
function togglePassword(){

    let box = document.getElementById("passBox");

    if(box.style.display === "block"){
        box.style.display = "none";
    }else{
        box.style.display = "block";
    }
}

/* SAVE PASSWORD */
function savePassword(){

    let pass = document.getElementById("newPass").value;
    let msg = document.getElementById("msg");

    if(pass.length < 6){
        msg.innerHTML = "❌ Password must be 6+ characters";
        msg.style.color = "red";
        return;
    }

    localStorage.setItem("password", pass);

    msg.innerHTML = "✅ Password Updated Successfully";
    msg.style.color = "lime";
}

/* LOGOUT */
function logoutUser(){

    let ok = confirm("Do you want to logout?");

    if(ok){
        localStorage.clear();
        window.location.href = "login.html";
    }
}

</script>

</body>
</html>
