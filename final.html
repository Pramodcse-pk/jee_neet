<!DOCTYPE html>
<html lang="en">
<head>


<title>JEE MAINS/NEET PRACTICE PORTAL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    color:white;
    overflow-x:hidden;
}

/* HEADER */

header{
    width:100%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.logo{
    font-size:32px;
    font-weight:700;
    letter-spacing:2px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    transition:0.4s;
    background:rgba(255,255,255,0.1);
    font-weight:600;
}

nav ul li a:hover{
    background:#38bdf8;
    transform:translateY(-3px);
}

/* SECTION */

section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:40px;
}

.card{
    width:90%;
    max-width:850px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    animation:fadeIn 1s ease;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:14px 28px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.4s;
    font-weight:600;
	
}

button:hover{
    background:#0ea5e9;
    transform:scale(1.05);
}

/* HOME */

.home-title{
    font-size:55px;
    margin-bottom:20px;
}

.home-text{
    font-size:22px;
    text-align:center;
    line-height:1.8;
}





/* ANIMATION */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */

@media(max-width:900px){

    header{
        flex-direction:column;
        gap:20px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }

    .home-title{
        font-size:40px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        JEE MAINS/NEET PRACTICE PORTAL
    </div>

    <nav>

        <ul>

            <li><a href="final.html">HOME</a></li>

            <li><a href="registration.html">REGISTRATION</a></li>

            <li><a href="samplesyllabus.html">SAMPLE SYLLABUS</a></li>

            <li><a href="login.html">LOGIN</a></li>

            <li><a href="#admin">ADMIN</a></li>

        </ul>

    </nav>

</header>

<!-- HOME -->

<section id="home">

    <div class="card">

        <h1 class="home-title">
            Welcome to JEE MAINS / NEET PRACTICE PORTAL
        </h1>

        <p class="home-text">
            Practice JEE Mains/NEET mock exams online with syllabus selection,
            student dashboard, timer-based examinations, results system,
            and modern exam interface.
        </p>

    </div>

</section>


</html>
