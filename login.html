<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JEE MAINS/NEET PRACTICE PORTAL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
}

/* ================= ANIMATED BACKGROUND ================= */

body::before,
body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation:move 8s infinite alternate;
    z-index:0;
}

body::before{
    top:-100px;
    left:-100px;
}

body::after{
    bottom:-100px;
    right:-100px;
}

@keyframes move{
    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(40px);
    }
}

/* ================= HEADER ================= */

header{
    width:100%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.logo{
    font-size:28px;
    font-weight:700;
    letter-spacing:1px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    transition:0.4s;
    background:rgba(255,255,255,0.1);
    font-weight:600;
}

nav ul li a:hover{
    background:#38bdf8;
    transform:translateY(-3px);
}

/* ================= SECTION ================= */

section{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:150px;
    padding-bottom:50px;
    position:relative;
    z-index:10;
}

/* ================= LOGIN CARD ================= */

.login-card{
    width:400px;
    padding:40px;
    border-radius:25px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    color:white;
    animation:fadeIn 1s ease;
}

/* ================= TITLE ================= */

.login-card h1{
    text-align:center;
    margin-bottom:30px;
    font-size:34px;
}

/* ================= INPUT BOX ================= */

.input-box{
    margin-bottom:22px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-size:15px;
    font-weight:500;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.18);
    color:white;
    font-size:15px;
    transition:0.3s;
}

.input-box input::placeholder{
    color:#d1d5db;
}

.input-box input:focus{
    background:rgba(255,255,255,0.28);
    transform:scale(1.02);
    box-shadow:0 0 10px #38bdf8;
}

/* ================= BUTTON ================= */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#06b6d4,#3b82f6);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.4s;
}

button:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

/* ================= MESSAGE ================= */

.message{
    margin-top:18px;
    text-align:center;
    font-size:15px;
    font-weight:500;
}

/* ================= ERROR ================= */

.error{
    border:2px solid red !important;
}

/* ================= SUCCESS ================= */

.success{
    border:2px solid limegreen !important;
}

/* ================= ANIMATION ================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(-40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }
}

@media(max-width:500px){

    .login-card{
        width:90%;
        padding:30px;
    }

    .login-card h1{
        font-size:28px;
    }
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        JEE MAINS/NEET PRACTICE PORTAL
    </div>

    <nav>

        <ul>

            <li><a href="final.html">HOME</a></li>

            <li><a href="registration.html">REGISTRATION</a></li>

            <li><a href="samplesyllabus.html">SYLLABUS</a></li>

            <li><a href="login.html">LOGIN</a></li>

            <li><a href="#">ADMIN</a></li>

        </ul>

    </nav>

</header>

<!-- ================= LOGIN SECTION ================= -->

<section id="login">

    <div class="login-card">

        <h1>Student Login</h1>

        <!-- MOBILE -->

        <div class="input-box">

            <label>Mobile Number</label>

            <input 
                type="tel" 
                id="mobile"
                placeholder="Enter Mobile Number"
                maxlength="10"
            >

        </div>

        <!-- PASSWORD -->

        <div class="input-box">

            <label>Password</label>

            <input 
                type="password" 
                id="password"
                placeholder="Enter Password"
            >

        </div>

        <!-- BUTTON -->

        <button onclick="loginUser()">
            Login Now
        </button>

        <!-- MESSAGE -->

        <div class="message" id="message"></div>

    </div>

</section>

<script>

/* ================= LOGIN VALIDATION ================= */

function loginUser(){

    let mobile = document.getElementById("mobile");

    let password = document.getElementById("password");

    let message = document.getElementById("message");

    /* REMOVE OLD CLASSES */

    mobile.classList.remove("error","success");

    password.classList.remove("error","success");

    message.innerHTML = "";

    /* MOBILE VALIDATION */

    if(mobile.value.trim() == ""){

        message.innerHTML = "❌ Please enter mobile number";

        mobile.classList.add("error");

        return;
    }

    if(isNaN(mobile.value) || mobile.value.length != 10){

        message.innerHTML = "❌ Enter valid 10 digit mobile number";

        mobile.classList.add("error");

        return;
    }

    /* PASSWORD VALIDATION */

    if(password.value.trim() == ""){

        message.innerHTML = "❌ Please enter password";

        password.classList.add("error");

        return;
    }

    if(password.value.length < 6){

        message.innerHTML = "❌ Password must contain minimum 6 characters";

        password.classList.add("error");

        return;
    }

    /* SUCCESS */

    mobile.classList.add("success");

    password.classList.add("success");

    message.innerHTML = "✅ Login Successful";

    message.style.color = "lime";

    /* REDIRECT */

    setTimeout(()=>{

        window.location.href = "dashboard.html";

    },1500);
}

</script>

</body>
</html>
