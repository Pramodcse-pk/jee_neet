<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JEE MAINS/NEET PRACTICE PORTAL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    color:white;
    overflow-x:hidden;
}

/* HEADER */

header{
    width:100%;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

.logo{
    font-size:32px;
    font-weight:700;
    letter-spacing:2px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    transition:0.4s;
    background:rgba(255,255,255,0.1);
    font-weight:600;
}

nav ul li a:hover{
    background:#38bdf8;
    transform:translateY(-3px);
}

/* SECTION */

section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:40px;
}

.card{
    width:90%;
    max-width:850px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    animation:fadeIn 1s ease;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:14px 28px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.4s;
    font-weight:600;
	
}

button:hover{
    background:#0ea5e9;
    transform:scale(1.05);
}

/* HOME */

.home-title{
    font-size:55px;
    margin-bottom:20px;
}

.home-text{
    font-size:22px;
    text-align:center;
    line-height:1.8;
}





/* ANIMATION */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */

@media(max-width:900px){

    header{
        flex-direction:column;
        gap:20px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
    }

    .home-title{
        font-size:40px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        JEE MAINS/NEET PRACTICE PORTAL
    </div>

    <nav>

        <ul>

            <li><a href="final.html">HOME</a></li>

            <li><a href="registration.html">REGISTRATION</a></li>

            <li><a href="samplesyllabus.html">SAMPLE SYLLABUS</a></li>

            <li><a href="login.html">LOGIN</a></li>

            <li><a href="#admin">ADMIN</a></li>

        </ul>

    </nav>

</header>

<!-- Sample syllabus -->

<!-- ================= SAMPLE SYLLABUS SECTION ================= -->

<section id="syllabus">

    <div class="syllabus-card">

        

        <!-- BUTTONS -->

        <div class="syllabus-buttons">

            <button onclick="showJEE()">
                JEE MAINS
            </button>

            <button onclick="showNEET()">
                NEET
            </button>

        </div>

        <!-- PDF VIEWER -->

        <div class="pdf-container">

            <!-- JEE PDF -->

            <iframe 
                id="jeePdf"
                class="pdf-viewer"
                src="jee.pdf">
            </iframe>

            <!-- NEET PDF -->

            <iframe 
                id="neetPdf"
                class="pdf-viewer hidden"
                src="neet.pdf">
            </iframe>

        </div>

    </div>

</section>

<style>

/* ================= SYLLABUS SECTION ================= */

#syllabus{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:120px 20px;
}

/* CARD */

.syllabus-card{
    width:95%;
    max-width:1100px;
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    animation:fadeIn 1s ease;
    color:white;
}

/* TITLE */

.syllabus-card h1{
    text-align:center;
    margin-bottom:30px;
    font-size:40px;
}

/* BUTTONS */

.syllabus-buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.syllabus-buttons button{
    padding:14px 35px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#06b6d4,#3b82f6);
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:0.4s;
}

.syllabus-buttons button:hover{
    transform:translateY(-5px) scale(1.05);
    background:linear-gradient(45deg,#3b82f6,#06b6d4);
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* PDF */

.pdf-container{
    width:100%;
}

.pdf-viewer{
    width:100%;
    height:650px;
    border:none;
    border-radius:18px;
    background:white;
    animation:fadeIn 0.8s ease;
}

/* HIDE */

.hidden{
    display:none;
}

/* RESPONSIVE */

@media(max-width:768px){

    .pdf-viewer{
        height:450px;
    }

    .syllabus-card h1{
        font-size:30px;
    }

}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

<script>

/* ================= SHOW JEE PDF ================= */

function showJEE(){

    document.getElementById("jeePdf")
    .classList.remove("hidden");

    document.getElementById("neetPdf")
    .classList.add("hidden");
}

/* ================= SHOW NEET PDF ================= */

function showNEET(){

    document.getElementById("neetPdf")
    .classList.remove("hidden");

    document.getElementById("jeePdf")
    .classList.add("hidden");
}

</script>


</html>
